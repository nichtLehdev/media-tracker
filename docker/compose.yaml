name: media-tracker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-media_tracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tracker}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Migrations run as a one-shot init container, never on app boot (S17).
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ['pnpm', '--filter', '@media-tracker/db', 'migrate']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ['pnpm', '--filter', '@media-tracker/web', 'start']
    restart: unless-stopped
    env_file: [../.env]
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ['pnpm', '--filter', '@media-tracker/worker', 'start']
    restart: unless-stopped
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
