# Builds apps/web as a container image and publishes it to GHCR.
#
# One image, three entrypoints (S17): the compose stack runs it as `migrate`,
# `web` and `worker` by overriding the command, so there is nothing to build
# per service.
name: Web image

on:
  push:
    branches: [main]
    paths:
      # Deliberately excludes plugin/**: a plugin release commits back to main,
      # and rebuilding the web image for it would be pure noise.
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/web-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag for this image (e.g. v1.2.0)'
        required: false
        type: string

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # An image that fails its own tests should never reach the registry, so this
  # gates the build rather than running beside it.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: media_tracker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The integration suites create a database per test file; without this
      # they skip, and skipping silently is not a passing build.
      DATABASE_URL: postgres://tracker:tracker@localhost:5432/media_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single arch: the deployment is one amd64 VPS (S17), and adding
          # arm64 roughly doubles build time for nothing. Add
          # linux/arm64 here if that ever changes.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull with \`docker pull ${{ env.IMAGE }}:latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
